# External synthetic reference recipient only. Never an Overnet backend.
protocols = imap lmtp
listen = 127.0.0.1
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid = 5000
log_path = /dev/stderr
info_log_path = /dev/stderr
passdb {
  driver = passwd-file
  args = /etc/dovecot/lab-users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/lab-users
}
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 2424
  }
}
protocol lmtp {
  postmaster_address = postmaster@reference.invalid
}
