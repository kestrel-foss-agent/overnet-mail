name: Perl quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: overnet_mail_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d overnet_mail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OVERNET_REQUIRE_POSTGRES: '1'
      OVERNET_TEST_PG_DSN: 'dbi:Pg:dbname=overnet_mail_test;host=127.0.0.1;port=5432'
      OVERNET_TEST_PG_USER: postgres
      PGUSER: postgres
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', 'latest']
    name: Perl ${{ matrix.perl }} tests and quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install native CPAN prerequisite
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libpq-dev
      - name: Install CPAN and pinned local style dependencies
        run: bash scripts/install-deps.sh
      - name: Normal and author tests
        run: |
          bash scripts/check.sh test
          bash scripts/check.sh author
      - name: Build and test the source distribution
        run: bash scripts/check.sh dist

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: overnet_mail_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d overnet_mail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OVERNET_REQUIRE_POSTGRES: '1'
      OVERNET_TEST_PG_DSN: 'dbi:Pg:dbname=overnet_mail_test;host=127.0.0.1;port=5432'
      OVERNET_TEST_PG_USER: postgres
      PGUSER: postgres
    name: Per-file coverage 95-85-100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.40'
      - name: Install native CPAN prerequisite
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libpq-dev
      - name: Install CPAN and pinned local style dependencies
        run: bash scripts/install-deps.sh
      - name: Fail-closed per-file coverage gate
        run: bash scripts/check.sh coverage

  real-mta:
    name: Real Postfix and Dovecot custody lab
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real engines with no runtime network
        run: bash scripts/real-mta-lab.sh check
